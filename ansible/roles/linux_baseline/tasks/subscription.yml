---
# Red Hat subscription registration

- name: Check Red Hat registration status
  ansible.builtin.command:
    cmd: subscription-manager identity
  register: subscription_identity
  changed_when: false
  failed_when: false

- name: Register system with Red Hat
  ansible.builtin.command:
    cmd: >
      subscription-manager register
      --activationkey={{ redhat_activation_key }}
      --org={{ redhat_org_id }}
  when: subscription_identity.rc != 0

- name: Show Red Hat registration status
  ansible.builtin.debug:
    msg: "Red Hat system is already registered"
  when: subscription_identity.rc == 0
