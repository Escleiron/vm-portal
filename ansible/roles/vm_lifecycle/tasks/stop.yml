---
# Stop VM

- name: Stop VM if running
  ansible.builtin.command:
    cmd: "virsh shutdown {{ vm_name }}"
  when: vm_state.stdout | trim == "running"

- name: Wait for VM to reach shut off state
  ansible.builtin.command:
    cmd: "virsh domstate {{ vm_name }}"
  register: stop_vm_state
  changed_when: false
  retries: 30
  delay: 2
  until: stop_vm_state.stdout | trim == "shut off"
  when: vm_state.stdout | trim == "running"

- name: Show stop result
  ansible.builtin.debug:
    msg: "VM {{ vm_name }} is stopped"
  when:
    - vm_state.stdout | trim == "running"

- name: Show stop no-op
  ansible.builtin.debug:
    msg: "VM {{ vm_name }} is already stopped"
  when:
    - vm_state.stdout | trim == "shut off"
