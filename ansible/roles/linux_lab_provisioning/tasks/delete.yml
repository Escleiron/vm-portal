---
# ============================================================
# DEFINE VM PATHS
# ============================================================

- name: Define VM storage paths
  ansible.builtin.set_fact:
    disk_path: "{{ libvirt_vm_dir }}/{{ vm_name }}.qcow2"
    trash_disk_path: "{{ libvirt_trash_dir }}/{{ vm_name }}.qcow2"
    ks_iso_path: "{{ libvirt_work_dir }}/{{ vm_name }}-ks.iso"
    cloudinit_iso_path: "{{ libvirt_work_dir }}/{{ vm_name }}-cidata.iso"


# ============================================================
# CHECK VM
# ============================================================

- name: Check if VM exists
  ansible.builtin.command:
    cmd: "virsh dominfo {{ vm_name }}"
  register: vm_info
  changed_when: false
  failed_when: false


- name: Show VM status
  ansible.builtin.debug:
    msg: "VM {{ vm_name }} exists in libvirt"
  when: vm_info.rc == 0


# ============================================================
# STOP VM
# ============================================================

- name: Destroy VM if running
  ansible.builtin.command:
    cmd: "virsh destroy {{ vm_name }}"
  when:
    - vm_info.rc == 0
    - "'running' in vm_info.stdout"


# ============================================================
# REMOVE VM DEFINITION
# ============================================================

- name: Undefine VM and remove UEFI NVRAM
  ansible.builtin.command:
    cmd: "virsh undefine {{ vm_name }} --nvram"
  when: vm_info.rc == 0


# ============================================================
# PREPARE TRASH DIRECTORY
# ============================================================

- name: Ensure trash directory exists
  ansible.builtin.file:
    path: "{{ libvirt_trash_dir }}"
    state: directory
    mode: "0755"


# ============================================================
# MOVE VM DISK TO TRASH
# ============================================================

- name: Check if VM disk exists
  ansible.builtin.stat:
    path: "{{ disk_path }}"
  register: vm_disk


- name: Remove previous disk from trash
  ansible.builtin.file:
    path: "{{ trash_disk_path }}"
    state: absent
  when: vm_disk.stat.exists


- name: Move VM qcow2 disk to trash
  ansible.builtin.command:
    cmd: "mv {{ disk_path }} {{ trash_disk_path }}"
  when: vm_disk.stat.exists


# ============================================================
# REMOVE KICKSTART ISO
# ============================================================

- name: Remove VM Kickstart ISO
  ansible.builtin.file:
    path: "{{ ks_iso_path }}"
    state: absent


# ============================================================
# REMOVE OLD CLOUD-INIT ISO
# ============================================================

# Kept for compatibility with VMs created by the previous
# Gold/cloud-init provisioning workflow.
- name: Remove old cloud-init ISO
  ansible.builtin.file:
    path: "{{ cloudinit_iso_path }}"
    state: absent


# ============================================================
# VERIFY DELETION
# ============================================================

- name: Verify VM no longer exists
  ansible.builtin.command:
    cmd: "virsh dominfo {{ vm_name }}"
  register: vm_verify
  changed_when: false
  failed_when: false


- name: Confirm VM deletion
  ansible.builtin.assert:
    that:
      - vm_verify.rc != 0
    fail_msg: "VM {{ vm_name }} still exists in libvirt"
    success_msg: "VM {{ vm_name }} successfully deleted"
